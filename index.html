<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materials Management Portal - Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-dark: #112b4e;
      --primary-mid: #8895a6;
      --primary-accent: #ec7723;
      --dark-20: rgba(17,43,78,0.2);
      --dark-10: rgba(17,43,78,0.1);
      --accent-20: rgba(236,119,35,0.2);
      --accent-05: rgba(236,119,35,0.05);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Exo', sans-serif;
      background: #f9f9f9;
      color: var(--primary-dark);
      overflow-x: hidden;
    }

    header {
      background: var(--primary-dark);
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem;
    }

    .header-logo {
      height: 300px;
      width: auto;
      object-fit: contain;
      max-width: 800px;
    }

    .container {
      max-width: 1100px;
      margin: -50px auto 60px;
      padding: 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 0 20px var(--dark-10);
    }

    .maintenance {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      border: 1px solid var(--dark-20);
      border-radius: 1rem;
    }

    .maintenance h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: .8rem;
      color: var(--primary-dark);
    }

    .maintenance p {
      color: var(--primary-mid);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 600px;
    }

    .accent-line {
      width: 70px;
      height: 4px;
      background: var(--primary-accent);
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 768px) {
      header {
        height: 220px;
      }

      .header-logo {
        height: 180px;
      }
    }

    @media (max-width: 700px) {
      body {
        background: #fff;
      }

      header {
        height: 110px;
        padding: 0 1rem;
      }

      .header-logo {
        height: 80px;
        max-width: 100%;
      }

      .container {
        margin: -16px 0 0;
        padding: .75rem .6rem 1.5rem;
        border-radius: 1rem 1rem 0 0;
        box-shadow: none;
      }

      .maintenance {
        min-height: 220px;
        border: none;
        padding: 2rem 1rem;
      }

      .maintenance h1 {
        font-size: 1.5rem;
      }
    }
  </style>
  <link rel="icon" href="favicon.png" type="image/png">
  <meta name="theme-color" content="#112b4e">
</head>
<body>
  <header>
    <img src="Field Register Header.png" alt="Field Register Logo" class="header-logo" />
  </header>

  <main class="container">
    <section class="maintenance">
      <div class="accent-line"></div>
      <h1>Under Maintenance</h1>
      <p>The Materials Management Portal is temporarily unavailable while maintenance is being completed. Please check back shortly.</p>
    </section>
  </main>
</body>
</html>
